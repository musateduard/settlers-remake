apply plugin: 'java'

import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform
import org.gradle.nativeplatform.platform.internal.ArchitectureInternal

repositories {
	mavenCentral()
}

dependencies {

    String lwjglVersion = "3.3.6"

	OperatingSystem os = DefaultNativePlatform.getCurrentOperatingSystem()
	ArchitectureInternal arch = DefaultNativePlatform.getCurrentArchitecture()

	String platform

	if (os.isWindows()) {

		if (arch.isAmd64()) {
			platform = "natives-windows"
		}

        else if (arch.isI386()) {
			platform = "natives-windows-x86"
		}

        else {
			platform = "natives-windows-arm64"
		}
	}

    else if (os.isMacOsX()) {

        if (arch.isAmd64() || arch.isI386()) {
			platform = "natives-macos"
		}

        else {
			platform = "natives-macos-arm64"
		}
	}

    else {

        if (arch.isAmd64()) {
			platform = "natives-linux"
		}

        else if (arch.isArm()) {
			platform = "natives-linux-arm32"
		}

        else {
			platform = "natives-linux-arm64"
		}
	}

    implementation gradleApi()
    implementation "org.lwjgl:lwjgl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-shaderc:${lwjglVersion}"
	runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:${platform}"
	runtimeOnly "org.lwjgl:lwjgl-shaderc:${lwjglVersion}:${platform}"
}